    <!-- 
      Offline Font Strategy:
      Google Fonts CDN provides Inter and JetBrains Mono when an internet connection is available.
      When operating in an air-gapped / offline environment, CSS font stacks define complete system
      fallbacks (-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Consolas, monospace).
      Font loading failure never blocks rendering or degrades layout.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
